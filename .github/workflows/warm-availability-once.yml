name: One-time availability warmup
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/warm-availability-once.yml
permissions:
  contents: read
jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Warm production reservation availability
        run: python .github/scripts/warm_availability_once.py
