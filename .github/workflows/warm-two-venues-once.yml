name: One-time warmup for Shima
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/warm-two-venues-once.yml
permissions:
  contents: read
jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Warm Shima with retries
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://prospect-line-webhook.line-harness-trampoline.workers.dev'
          success=0
          for attempt in 1 2 3 4 5 6; do
            echo "attempt=$attempt"
            body=$(mktemp)
            code=$(curl -A 'Mozilla/5.0' -sS -o "$body" -w '%{http_code}' -X POST -H 'content-type: application/json' --data '{"route":"d/shima"}' "$BASE/api/reservations/availability" || true)
            if [ "$code" = 200 ] && jq -e '.ok == true' "$body" >/dev/null 2>&1; then
              success=1
              break
            fi
            echo "http=$code"
            cat "$body" || true
            sleep 3
          done
          [ "$success" = 1 ]
          for n in 1 2 3 4 5; do
            state=$(curl -A 'Mozilla/5.0' -sS "$BASE/health/availability-snapshot?route=d%2Fshima" | jq -r '.state // empty')
            [ "$state" = ready ] && break
            sleep 1
          done
          echo "d/shima state=$state"
          [ "$state" = ready ]
