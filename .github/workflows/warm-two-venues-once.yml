name: One-time warmup for Komatsu and Shima
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/warm-two-venues-once.yml
permissions:
  contents: read
jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Warm two venues
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://prospect-line-webhook.line-harness-trampoline.workers.dev'
          for route in d/komatsu d/shima; do
            echo "warming $route"
            body=$(curl -A 'Mozilla/5.0' -sS --fail-with-body --retry 2 --retry-delay 1 \
              -X POST -H 'content-type: application/json' \
              --data "{\"route\":\"$route\"}" \
              "$BASE/api/reservations/availability")
            printf '%s\n' "$body" | python -c "import json,sys; d=json.load(sys.stdin); assert d.get('ok') is True"
            encoded=${route//\//%2F}
            for n in 1 2 3 4 5; do
              state=$(curl -A 'Mozilla/5.0' -sS "$BASE/health/availability-snapshot?route=$encoded" | python -c "import json,sys; print(json.load(sys.stdin).get('state',''))")
              [ "$state" = ready ] && break
              sleep 1
            done
            echo "$route state=$state"
            [ "$state" = ready ]
          done
